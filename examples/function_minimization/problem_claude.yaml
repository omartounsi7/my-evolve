# Function minimization: the global minimum of f(x, y) = sin(x) cos(y) + sin(xy) + (x^2 + y^2) / 20.
#
# The description is the system message of OpenEvolve's
# examples/function_minimization/config.yaml (commit da3d701), followed by the contract
# of the entry function (D4). Everything but the llm section must stay the same for
# a run to be continued (D50); problem.yaml differs from this file only there.

name: function_minimization
description: |
  You are an expert programmer specializing in optimization algorithms. Your task is to improve a function minimization algorithm to find the global minimum of a complex function with many local minima. The function is f(x, y) = sin(x) * cos(y) + sin(x*y) + (x^2 + y^2)/20. Focus on improving the search_algorithm function to reliably find the global minimum, escaping local minima that might trap simple algorithms.

  The program must keep run_search(), which takes no arguments and returns the point
  it found as a tuple (x, y, value), where value is f(x, y); the value is always
  recomputed from x and y.
entry_functions: [run_search]
# The packages programs may import, at my-alphaevolve's versions (D71).
packages:
  - numpy==2.5.4
  - scipy==1.18.1

# OpenEvolve's cascade (D9): 60 s per stage; stage 2 runs if stage 1 scores at least 1.3.
evaluation:
  stage_time_limit: 60
  thresholds: [1.3]

# Batch 2 of Appendix B: Claude models, through Anthropic's OpenAI-compatible endpoint.
# The key is read from the ANTHROPIC_API_KEY environment variable; these models take no
# temperature (D33).
llm:
  api_base: https://api.anthropic.com/v1/
  api_key: ${ANTHROPIC_API_KEY}
  models:
    - name: claude-haiku-5-5
      weight: 0.8
    - name: claude-sonnet-5-5
      weight: 0.2
