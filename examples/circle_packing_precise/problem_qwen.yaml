# Circle packing at full precision: 26 circles in the unit square, maximizing the sum of
# their radii.
#
# What differs from ../circle_packing/problem_claude_3d.yaml:
# - the evaluation (evaluation.py here) scores the legal sum of the radii itself:
#   violations are shrunk away instead of tolerated, and no reference divides the sum;
# - the description says how the score is measured and what can improve a packing, and
#   refers to no earlier result;
# - each program gets one stage of 5 minutes and 4 CPUs.
# The initial program is OpenEvolve's, as in ../circle_packing.
#
# problem.yaml with one of Ollama's qwen models, qwen3-coder:30b, instead of Claude's, and
# a 2D grid (code size and radii spread). Everything else is the same.

name: circle_packing_precise
description: |
  You are an expert mathematician specializing in circle packing problems, computational geometry and high-precision numerical optimization. Your task is to improve a program that produces an arrangement of 26 circles in a unit square, maximizing the sum of their radii.

  How the score is measured:
  - The score is the sum of the radii, measured exactly in 64-bit floats. Higher is better, and every gain counts, however small.
  - Only legal geometry counts. The packing's worst violation (the most two circles overlap, or one sticks out of the square) is subtracted from every radius before summing, so a packing that relies on tolerance loses up to 26 times what it gains. Aim for packings that are exactly legal, with contacts that touch within about 1e-12.

  What can improve a packing:
  - Its contact graph: which circles touch which, and which touch the walls. Good packings are rigid: every circle is held by its contacts.
  - Polishing a candidate to full precision: solve the contact equations with Newton's method or a high-precision solver, rather than stopping a general optimizer at its default tolerance.
  - Searching widely from many starting layouts (perturbed copies of good layouts, different row structures, random starts), then polishing only the best.
  - The program has 4 CPUs and 5 minutes; stop the search well before that limit.

  The program must keep run_packing(), which takes no arguments and returns
  (centers, radii, sum_of_radii): centers, a numpy array of shape (26, 2) holding the
  (x, y) of each circle's centre; radii, a numpy array of shape (26,); and
  sum_of_radii, their sum. Every circle must lie inside the unit square [0, 1] x [0, 1]
  and no two circles may overlap; violations up to 1e-6 are subtracted from the radii as
  described above, and larger ones make the packing invalid. No radius may be negative.

# The function every program must define, which the evaluation calls.
entry_functions: [run_packing]

# The packages programs may import, as in OpenEvolve, at my-alphaevolve's versions.
packages:
  - matplotlib==3.11.2
  - numpy==2.5.4
  - scipy==1.18.1

# The LLM: qwen3-coder:30b alone, from Appendix B's batch 1, on a local Ollama server.
# Start Ollama with a context length that holds the prompt and the reply (with 32 GB of
# GPU memory, recent versions use 32,768 by default):
#   OLLAMA_CONTEXT_LENGTH=32768 ollama serve
llm:
  api_base: http://localhost:11434/v1
  # Ollama's context, as started above: the prompt's budget (max_chars below) plus the
  # model's max_tokens must fit in it, or the problem file is refused.
  context_length: 32768
  models:
    - name: qwen3-coder:30b
      weight: 1.0

# The prompt's budget, in characters: about 11,400 tokens, which with the reply's 16,384
# (max_tokens, by default) fit in the 32,768 of the context.
prompt:
  max_chars: 40000

# One grid per island (islands.count, 3 by default), each with these two dimensions:
# code size and how much the radii vary. 5 bins each, the default for two features: 25
# cells per island.
grid:
  features:
    - {name: code_complexity, low: 0, high: 2.5}
    - {name: radii_spread, low: 0, high: 1.5}

# One stage, which may last 5 minutes: at this precision, programs need long, careful
# optimization (the original allows 60 s).
evaluation:
  stage_time_limit: 300

# 4 CPUs per program (the default is 1): with 2 workers, 8 CPUs in all. Numeric libraries
# get as many threads.
sandbox:
  memory: 2g
  cpus: 4
