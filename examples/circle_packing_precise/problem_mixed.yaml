# Circle packing at full precision: 26 circles in the unit square, maximizing the sum of
# their radii.
#
# What differs from ../circle_packing/problem_claude_3d.yaml:
# - the evaluation (evaluation.py here) scores the legal sum of the radii itself:
#   violations are shrunk away instead of tolerated, and no reference divides the sum;
# - the description says how the score is measured, gives no hints on how to solve the
#   problem, and refers to no earlier result;
# - each program gets one stage of 60 seconds and 3 CPUs.
# The initial program is OpenEvolve's, as in ../circle_packing.
#
# problem.yaml with three models from three makers in one ensemble: qwen3-coder:30b
# (Alibaba) and gemma4:12b (Google) on Ollama, and Claude Sonnet 4.5 (Anthropic).
# Everything but the llm section is the same.

name: circle_packing_precise
description: |
  You are an expert in circle packing and numerical optimization. Improve the program
  so that it places 26 circles in the unit square [0, 1] x [0, 1] with the largest
  possible sum of radii.

  Scoring: the score is the sum of the radii. The packing's worst overlap (between two
  circles, or past a wall) is first subtracted from every radius, so make contacts exact
  to about 1e-12. An overlap above 1e-6 makes the packing invalid.

  The program has 3 CPUs and 60 seconds; it must return within that time, or it fails.

  The evolve block must define construct_packing(), which takes no arguments and
  returns (centers, radii, sum_of_radii): a (26, 2) numpy array of centres, a (26,)
  numpy array of non-negative radii, and their sum. Do not define run_packing() there:
  the fixed code defines it, and it calls construct_packing().

# The function every program must define, which the evaluation calls.
entry_functions: [run_packing]

# The packages programs may import, as in OpenEvolve, at my-alphaevolve's versions.
packages:
  - matplotlib==3.11.2
  - numpy==2.5.4
  - scipy==1.18.1

# The LLMs: three models from three makers, drawn equally often.
# - qwen3-coder:30b and gemma4:12b on a local Ollama server, each with a context of 32,768
#   tokens (with 32 GB of GPU memory, recent versions use 32,768 by default). Together
#   they take about 31 of the RTX 5090's 32.6 GB, so both stay loaded.
# - Claude Sonnet 4.5, the oldest Sonnet the Claude API serves (Sonnet 3.7, which
#   OpenEvolve's circle-packing configs once used, was retired on February 19, 2026),
#   through Anthropic's OpenAI-compatible endpoint. The key is read from the variable
#   ANTHROPIC_API_KEY. It is deprecated and retires on November 30, 2026: after that its
#   calls fail, and the run drops it after max_failures_in_a_row failures, then goes on
#   with the other two.
llm:
  models:
    - name: qwen3-coder:30b
      weight: 0.33
      api_base: http://localhost:11434/v1
      # Ollama's context: the prompt's budget (max_chars below) plus max_tokens must fit.
      context_length: 32768
    - name: gemma4:12b
      weight: 0.33
      api_base: http://localhost:11434/v1
      context_length: 32768
    # Prices in dollars per million input and output tokens, for the summary's cost.
    - name: claude-sonnet-4-5-20250929
      weight: 0.34
      api_base: https://api.anthropic.com/v1/
      api_key: ${ANTHROPIC_API_KEY}
      price_input: 3.00
      price_output: 15.00

# The prompt's budget, in characters: about 11,400 tokens, which with the reply's 16,384
# (max_tokens, by default) fit in the 32,768 of Ollama's context. gemma4:12b thinks
# before it answers: 8,835 tokens for its reply to an 11,436-token prompt.
prompt:
  max_chars: 40000

# One grid per island (islands.count, 3 by default), 3 x 3 x 3 = 27 cells, 81 over the
# 3 islands, a fair size for a few hundred iterations:
# - code_complexity, log2 of the nodes inside the evolve block against the initial
#   program's (1: twice as many, 2: four times): [0, 1), [1, 2), [2, +inf), since values
#   past the range go to the end bin;
# - radii_spread: [0, 1/3), [1/3, 2/3), [2/3, +inf);
# - radius_centre_correlation, whether the big circles are in the middle (-1) or at the
#   edges (+1): [-1, -1/3), [-1/3, 1/3), [1/3, 1].
grid:
  features:
    - {name: code_complexity, low: 0, high: 3, bins: 3}
    - {name: radii_spread, low: 0, high: 1, bins: 3}
    - {name: radius_centre_correlation, low: -1, high: 1, bins: 3}

# One stage of 60 s, OpenEvolve's limit. It was 5 minutes, but programs that do not
# watch the clock then ran until killed: in runs/mixed_3d_1, 2 of the first 5 children
# timed out after 300 s each.
evaluation:
  stage_time_limit: 60

# 3 CPUs per program (the default is 1): with 2 workers, 6 of the machine's 8, leaving 2
# for Docker, the loop, Ollama and the desktop (with 4 each, programs that stop on a
# wall-clock budget competed for every CPU). Numeric libraries get as many threads.
sandbox:
  memory: 2g
  cpus: 3
