# Circle packing: 26 circles in the unit square, maximizing the sum of their radii.
#
# The description is the system message of OpenEvolve's
# examples/circle_packing/config_phase_1.yaml (commit da3d701), followed by the contract
# of the entry function (D4). Everything but the llm section must stay the same for
# a run to be continued (D50); problem_claude.yaml differs from this file only there.

name: circle_packing
description: |
  You are an expert mathematician specializing in circle packing problems and computational geometry. Your task is to improve a constructor function that directly produces a specific arrangement of 26 circles in a unit square, maximizing the sum of their radii. The AlphaEvolve paper achieved a sum of 2.635 for n=26.

  Key geometric insights:
  - Circle packings often follow hexagonal patterns in the densest regions
  - Maximum density for infinite circle packing is pi/(2*sqrt(3)) ≈ 0.9069
  - Edge effects make square container packing harder than infinite packing
  - Circles can be placed in layers or shells when confined to a square
  - Similar radius circles often form regular patterns, while varied radii allow better space utilization
  - Perfect symmetry may not yield the optimal packing due to edge effects

  Focus on designing an explicit constructor that places each circle in a specific position, rather than an iterative search algorithm.

  The program must keep run_packing(), which takes no arguments and returns
  (centers, radii, sum_of_radii): centers, a numpy array of shape (26, 2) holding the
  (x, y) of each circle's centre; radii, a numpy array of shape (26,); and
  sum_of_radii, their sum. Every circle must lie inside the unit square [0, 1] x [0, 1]
  and no two circles may overlap, up to a tolerance of 1e-6; no radius may be negative.
entry_functions: [run_packing]
# The packages programs may import, at my-alphaevolve's versions (D71).
packages:
  - matplotlib==3.11.2
  - numpy==2.5.4
  - scipy==1.18.1

# OpenEvolve's cascade (D9): 60 s per stage; stage 2 runs if stage 1 scores at least 0.5.
evaluation:
  stage_time_limit: 60
  thresholds: [0.5]

# Batch 1 of Appendix B: two local models served by Ollama, which keeps both loaded.
# Start Ollama with a context length that holds the whole prompt and the reply:
#   OLLAMA_CONTEXT_LENGTH=32768 ollama serve
llm:
  api_base: http://localhost:11434/v1
  models:
    - name: qwen3-coder:30b
      weight: 0.8
    - name: qwen3:8b
      weight: 0.2
